<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Admin</title>

style.css

</head>

<body>

<h1>L-Gate Teacher Manager</h1>

<div class="stats">

<div class="stat">
<div id="totalCount">0</div>
<small>Wszystkich</small>
</div>

<div class="stat">
<div id="year1Count">0</div>
<small>1年</small>
</div>

<div class="stat">
<div id="year2Count">0</div>
<small>2年</small>
</div>

<div class="stat">
<div id="year3Count">0</div>
<small>3年</small>
</div>

</div>

<div class="toolbar">

<input
id="search"
placeholder="Szukaj nauczyciela">

<select id="yearFilter">

<option value="">
Wszystkie lata
</option>

<option value="1">
1年
</option>

<option value="2">
2年
</option>

<option value="3">
3年
</option>

</select>

<input
type="file"
id="csvFile"
accept=".csv">

<button id="csvImportBtn">
Import CSV
</button>

<button id="csvExportBtn">
Eksport CSV
</button>

<button id="sampleBtn">
Szablon CSV
</button>

</div>

<div class="form">

<input
id="editId"
type="hidden">

<input
id="lgate"
placeholder="L-Gate">

<input
id="name"
placeholder="Imię i nazwisko">

<select id="grade">

<option value="1">
1年
</option>

<option value="2">
2年
</option>

<option value="3">
3年
</option>

</select>

<select id="group">

<option value="1">1組</option>
<option value="2">2組</option>
<option value="3">3組</option>
<option value="4">4組</option>
<option value="5">5組</option>
<option value="6">6組</option>
<option value="7">7組</option>
<option value="8">8組</option>
<option value="9">9組</option>
<option value="10">10組</option>

</select>

<button id="saveBtn">
Zapisz
</button>

</div>

<table>

<thead>

<tr>
<th>L-Gate</th>
<th>Nauczyciel</th>
<th>Klasa</th>
<th>Akcje</th>
</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

<script>

if(
sessionStorage.getItem("logged")!=="1"
){
location.href="index.html";
}

let teachers =
JSON.parse(
localStorage.getItem("teachers")
|| "[]"
);

function saveData(){

localStorage.setItem(
"teachers",
JSON.stringify(teachers)
);

}

function updateStats(){

document.getElementById(
"totalCount"
).innerText = teachers.length;

document.getElementById(
"year1Count"
).innerText =
teachers.filter(
t=>t.grade==="1"
).length;

document.getElementById(
"year2Count"
).innerText =
teachers.filter(
t=>t.grade==="2"
).length;

document.getElementById(
"year3Count"
).innerText =
teachers.filter(
t=>t.grade==="3"
).length;

}

function renderTable(){

const tbody =
document.getElementById("tbody");

tbody.innerHTML="";

const search =
document.getElementById(
"search"
).value.toLowerCase();

const filter =
document.getElementById(
"yearFilter"
).value;

teachers.forEach((t,index)=>{

if(
filter &&
t.grade!==filter
){
return;
}

if(
search &&
!(
t.name.toLowerCase().includes(search)
||
t.lgate.toLowerCase().includes(search)
||
`${t.grade}年${t.group}組`
.includes(search)
)
){
return;
}

const tr =
document.createElement("tr");

tr.innerHTML = `

<td>${t.lgate}</td>

<td>${t.name}</td>

<td>
${t.grade}年${t.group}組
</td>

<td>

<button onclick="editTeacher(${index})">
Edytuj
</button>

<button onclick="deleteTeacher(${index})">
Usuń
</button>

</td>

`;

tbody.appendChild(tr);

});

updateStats();

}

function saveTeacher(){

const teacher = {

lgate:
document.getElementById(
"lgate"
).value,

name:
document.getElementById(
"name"
).value,

grade:
document.getElementById(
"grade"
).value,

group:
document.getElementById(
"group"
).value

};

const id =
document.getElementById(
"editId"
).value;

if(id===""){

teachers.push(teacher);

}else{

teachers[id]=teacher;

}

saveData();

renderTable();

}

function editTeacher(index){

const t=teachers[index];

document.getElementById(
"editId"
).value=index;

document.getElementById(
"lgate"
).value=t.lgate;

document.getElementById(
"name"
).value=t.name;

document.getElementById(
"grade"
).value=t.grade;

document.getElementById(
"group"
).value=t.group;

}

function deleteTeacher(index){

if(
confirm("Usunąć nauczyciela?")
){

teachers.splice(index,1);

saveData();

renderTable();

}

}

document.getElementById(
"saveBtn"
).addEventListener(
"click",
saveTeacher
);

document.getElementById(
"search"
).addEventListener(
"input",
renderTable
);

document.getElementById(
"yearFilter"
).addEventListener(
"change",
renderTable
);

document.getElementById(
"sampleBtn"
).addEventListener(
"click",
function(){

window.open(
"sample_teachers.csv",
"_blank"
);

}
);

document.getElementById(
"csvExportBtn"
).addEventListener(
"click",
function(){

let csv =
"lgate,name,grade,group\n";

teachers.forEach(t=>{

csv +=
`${t.lgate},${t.name},${t.grade},${t.group}\n`;

});

const a =
document.createElement("a");

a.href=
URL.createObjectURL(
new Blob([csv])
);

a.download=
"teachers.csv";

a.click();

}
);

document.getElementById(
"csvImportBtn"
).addEventListener(
"click",
function(){

const file =
document.getElementById(
"csvFile"
).files[0];

if(!file){

alert("Wybierz CSV");

return;

}

const reader =
new FileReader();

reader.onload =
function(e){

const lines =
e.target.result
.trim()
.split(/\r?\n/);

teachers=[];

for(let i=1;i<lines.length;i++){

const row=
lines[i].split(",");

teachers.push({

lgate:row[0],
name:row[1],
grade:row[2],
group:row[3]

});

}

saveData();

renderTable();

alert("CSV zaimportowany");

};

reader.readAsText(
file,
"utf-8"
);

}
);

renderTable();

</script>

</body>
</html>
