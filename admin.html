<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Admin</title></head><body><div class="header"><h2>L-Gate Teacher Manager v6</h2></div><div class="stats"><div class="stat"><div id="total">0</div><small>Razem</small></div><div class="stat"><div id="y1">0</div><small>1年</small></div><div class="stat"><div id="y2">0</div><small>2年</small></div><div class="stat"><div id="y3">0</div><small>3年</small></div></div><div class="form"><input type="hidden" id="editId"><input id="lgate" placeholder="L-Gate"><input id="name" placeholder="Imię i nazwisko"><select id="grade"><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option></select><select id="group"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><input id="role" placeholder="Funkcja / Uwagi"><button id="saveBtn">Zapisz</button></div><div class="toolbar"><input id="search" placeholder="Szukaj"><select id="yearFilter"><option value="">Wszystkie lata</option><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option></select><input type="file" id="csvFile" accept=".csv"><input type="file" id="jsonFile" accept=".json"><button id="importCsv">Import CSV</button><button id="exportCsv">Eksport CSV</button><button id="importJson">Import JSON</button><button id="exportJson">Eksport JSON</button></div><div id="cards" class="cards"></div><script>if(sessionStorage.getItem('logged')!=='1')location='index.html';let teachers=JSON.parse(localStorage.getItem('teachers')||'[]');const $=i=>document.getElementById(i);function save(){localStorage.setItem('teachers',JSON.stringify(teachers));}function stats(){$('total').textContent=teachers.length;$('y1').textContent=teachers.filter(t=>t.grade==='1').length;$('y2').textContent=teachers.filter(t=>t.grade==='2').length;$('y3').textContent=teachers.filter(t=>t.grade==='3').length;}function render(){const s=$('search').value.toLowerCase();const y=$('yearFilter').value;cards.innerHTML='';teachers.filter(t=>(!y||t.grade===y)&&(`${t.name} ${t.lgate} ${(t.role||'')} ${t.grade}年${t.group}組`.toLowerCase().includes(s))).forEach((t,i)=>{const d=document.createElement('div');d.className='teacher-card';d.innerHTML=`<b>${t.name}</b><div class='small'>${t.lgate}</div><div>${t.grade}年${t.group}組</div><div>${t.role||''}</div><p><button onclick='editTeacher(${i})'>Edytuj</button> <button onclick='deleteTeacher(${i})'>Usuń</button></p>`;cards.appendChild(d);});stats();}function editTeacher(i){const t=teachers[i];$('editId').value=i;$('lgate').value=t.lgate;$('name').value=t.name;$('grade').value=t.grade;$('group').value=t.group;$('role').value=t.role||'';}function deleteTeacher(i){teachers.splice(i,1);save();render();}window.editTeacher=editTeacher;window.deleteTeacher=deleteTeacher;$('saveBtn').onclick=()=>{const t={lgate:$('lgate').value,name:$('name').value,grade:$('grade').value,group:$('group').value,role:$('role').value};const id=$('editId').value;if(id==='')teachers.push(t);else teachers[Number(id)]=t;save();render();};$('search').oninput=render;$('yearFilter').onchange=render;$('exportJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(teachers,null,2)]));a.download='teachers.json';a.click();};$('importJson').onclick=()=>{const f=$('jsonFile').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{teachers=JSON.parse(e.target.result);save();render();};r.readAsText(f);};$('exportCsv').onclick=()=>{let c='lgate,name,grade,group,role
';teachers.forEach(t=>c+=`${t.lgate},${t.name},${t.grade},${t.group},${t.role||''}
`);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c]));a.download='teachers.csv';a.click();};$('importCsv').onclick=()=>{const f=$('csvFile').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{teachers=[];e.target.result.trim().split(/?
/).slice(1).forEach(l=>{const c=l.split(',');teachers.push({lgate:c[0]||'',name:c[1]||'',grade:c[2]||'1',group:c[3]||'1',role:c[4]||''});});save();render();};r.readAsText(f);};render();</script></body></html>
