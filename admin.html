<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin</title>

style.css

</head>

<body>

<div class="header">

<h1>L-Gate Teacher Manager</h1>

<button onclick="logout()">
Wyloguj
</button>

</div>

<div class="stats">

<div class="card">
<span id="countAll">0</span>
<small>Nauczycieli</small>
</div>

<div class="card green">
<span id="count1">0</span>
<small>Typ 1</small>
</div>

<div class="card blue">
<span id="count2">0</span>
<small>Typ 2</small>
</div>

<div class="card red">
<span id="count3">0</span>
<small>Typ 3</small>
</div>

</div>

<div class="toolbar">

<input
id="search"
placeholder="Szukaj..."
onkeyup="renderTable()">

<select id="filterType" onchange="renderTable()">
<option value="">Wszystkie typy</option>
<option value="1">Typ 1</option>
<option value="2">Typ 2</option>
<option value="3">Typ 3</option>
</select>

<select id="sortBy" onchange="renderTable()">
<option value="nameAsc">Nazwisko A-Z</option>
<option value="nameDesc">Nazwisko Z-A</option>
<option value="typeAsc">Typ 1→3</option>
<option value="typeDesc">Typ 3→1</option>
</select>

<button onclick="exportJSON()">
Eksport JSON
</button>

<button onclick="copyJSON()">
Kopiuj JSON
</button>

</div>

<div class="form">

<input id="editId" type="hidden">

<input id="lgate" placeholder="Adres L-Gate">

<input id="name" placeholder="Imię i nazwisko">

<select id="type">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>

<input id="year" placeholder="2025">

<input id="className" placeholder="1-1">

<button onclick="saveTeacher()">
Zapisz
</button>

</div>

<table>

<thead>

<tr>
<th>L-Gate</th>
<th>Imię i nazwisko</th>
<th>Typ</th>
<th>Rok</th>
<th>Klasa</th>
<th>Akcje</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

<h2>Aktualny JSON</h2>

<textarea id="jsonOutput" readonly></textarea>

app.jsscript>

</body>
</html>
