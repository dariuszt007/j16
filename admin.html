<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><h1>L-Gate Teacher Manager v7</h1><div class="toolbar"><input id="search" placeholder="Szukaj"><select id="yearFilter"><option value="">Wszystkie lata</option><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option></select></div><div class="form"><input id="editId" type="hidden"><input id="lgate" placeholder="L-Gate"><input id="name" placeholder="Nauczyciel"><select id="grade"><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option></select><select id="group"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><input id="role" placeholder="Funkcja / Uwagi"><button id="saveBtn">Zapisz nauczyciela</button></div><h3>Import CSV (teachers.csv)</h3><input type="file" id="csvFile" accept=".csv"><button id="importCsvBtn">Import CSV</button><button id="sampleCsvBtn">Pobierz sample CSV</button><button id="exportCsvBtn">Eksport CSV</button><h3>Import JSON (teachers.json)</h3><input type="file" id="jsonFile" accept=".json"><button id="importJsonBtn">Import JSON</button><button id="exportJsonBtn">Eksport JSON</button><hr><div id="cards" class="grid"></div><script>if(sessionStorage.getItem('logged')!=='1'){location='index.html';}const $=id=>document.getElementById(id);let teachers=JSON.parse(localStorage.getItem('teachers')||'[]');function persist(){localStorage.setItem('teachers',JSON.stringify(teachers));}function render(){const cards=$('cards');cards.innerHTML='';const q=$('search').value.toLowerCase();const y=$('yearFilter').value;teachers.filter(t=>(!y||t.grade===y)&&(`${t.name} ${t.lgate} ${t.role||''} ${t.grade}年${t.group}組`.toLowerCase().includes(q))).forEach((t,i)=>{const d=document.createElement('div');d.className='teacher';const e=document.createElement('button');e.textContent='Edytuj';e.addEventListener('click',()=>editTeacher(i));const r=document.createElement('button');r.textContent='Usuń';r.addEventListener('click',()=>removeTeacher(i));d.innerHTML=`<h3>${t.name}</h3><div class="muted">${t.lgate}</div><div>${t.grade}年${t.group}組</div><div>${t.role||''}</div>`;d.appendChild(e);d.appendChild(r);cards.appendChild(d);});}function editTeacher(i){const t=teachers[i];$('editId').value=i;$('lgate').value=t.lgate;$('name').value=t.name;$('grade').value=t.grade;$('group').value=t.group;$('role').value=t.role||'';}function removeTeacher(i){teachers.splice(i,1);persist();render();}document.getElementById('saveBtn').addEventListener('click',function(){const t={lgate:$('lgate').value,name:$('name').value,grade:$('grade').value,group:$('group').value,role:$('role').value};const id=$('editId').value;if(id==='')teachers.push(t);else teachers[Number(id)]=t;persist();render();});$('search').addEventListener('input',render);$('yearFilter').addEventListener('change',render);document.getElementById('importCsvBtn').addEventListener('click',function(){const f=$('csvFile').files[0];if(!f){alert('Wybierz teachers.csv');return;}const r=new FileReader();r.onload=e=>{teachers=[];e.target.result.trim().split(/?
/).slice(1).forEach(l=>{const c=l.split(',');teachers.push({lgate:c[0]||'',name:c[1]||'',grade:c[2]||'1',group:c[3]||'1',role:c[4]||''});});persist();render();alert('Import CSV OK');};r.readAsText(f);});document.getElementById('exportCsvBtn').addEventListener('click',function(){let c='lgate,name,grade,group,role
';teachers.forEach(t=>c+=`${t.lgate},${t.name},${t.grade},${t.group},${t.role||''}
`);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c]));a.download='teachers.csv';a.click();});document.getElementById('importJsonBtn').addEventListener('click',function(){const f=$('jsonFile').files[0];if(!f){alert('Wybierz teachers.json');return;}const r=new FileReader();r.onload=e=>{teachers=JSON.parse(e.target.result);persist();render();alert('Import JSON OK');};r.readAsText(f);});document.getElementById('exportJsonBtn').addEventListener('click',function(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(teachers,null,2)]));a.download='teachers.json';a.click();});document.getElementById('sampleCsvBtn').addEventListener('click',function(){let a=document.createElement('a');a.href='sample_teachers.csv';a.download='sample_teachers.csv';a.click();});render();</script></body></html>
