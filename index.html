<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L-Gate Teacher Manager</title>

style.css

</head>
<body class="login-page">

<div class="login-card">

<h1>L-Gate Manager</h1>

<p>Panel administracyjny nauczycieli</p>

<input
type="password"
id="password"
placeholder="Hasło">

<button onclick="login()">
Zaloguj
</button>

<p id="error" class="error"></p>

</div>

<script>

function login(){

const password=
document.getElementById("password").value;

if(password==="1111"){

sessionStorage.setItem("logged","true");

location.href="admin.html";

}else{

document.getElementById("error").textContent=
"Nieprawidłowe hasło";

}

}

</script>

</body>
</html>
