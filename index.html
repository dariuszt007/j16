<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L-Gate Teacher Manager</title>

<style>
body{
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f5f5f5;
}

.login{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
width:350px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
margin-top:10px;
width:100%;
padding:10px;
background:#1976d2;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1565c0;
}
</style>

</head>
<body>

<div class="login">

<h2>L-Gate Teacher Manager</h2>

<input
type="password"
id="password"
placeholder="Hasło">

<button onclick="login()">
Zaloguj
</button>

<p id="msg"></p>

</div>

<script>

function login(){

const p=document.getElementById("password").value;

if(p==="1111"){

sessionStorage.setItem("logged","yes");
location.href="admin.html";

}else{

document.getElementById("msg").innerText=
"Błędne hasło";

}

}

</script>

</body>
</html>
